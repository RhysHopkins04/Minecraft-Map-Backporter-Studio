name: Feature request
description: Suggest a conversion, analysis, UI, or compatibility improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Describe what the application should do from the user's point of view.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Relevant Minecraft / loader versions
