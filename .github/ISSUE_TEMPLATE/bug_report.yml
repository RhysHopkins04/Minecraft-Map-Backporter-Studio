name: Bug report
description: Report a reproducible application or conversion problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not upload copyrighted maps/modpacks/mod JARs unless you have permission to redistribute them. Prefer logs and minimal reproductions.
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: "0.4.1"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple Silicon
        - Windows x64
        - Source/development environment
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behaviour and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Give the smallest repeatable sequence you can.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Minecraft / map / mod context
      description: Source Minecraft version, target version, loaders/mods involved, and relevant block names.
  - type: textarea
    id: logs
    attributes:
      label: Logs or report excerpts
      render: text
