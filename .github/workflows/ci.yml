name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install core dependencies
        run: python -m pip install -r requirements.txt

      - name: Static project verification
        run: python scripts/verify_project.py

      - name: Core smoke tests
        run: python tests/test_smoke.py

      - name: Compile Python source
        run: python -m compileall -q launcher.py src tests scripts

      - name: Validate macOS shell scripts
        run: bash -n packaging/macos/*.sh
