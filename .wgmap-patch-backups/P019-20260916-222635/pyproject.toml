[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wg-map-backporter-studio"
version = "0.4.1"
description = "Cross-platform desktop toolkit for Minecraft Java map backporting, mod analysis, and reusable block mappings"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PySide6>=6.7,<7",
]

[project.scripts]
wg-map-backporter-studio = "wgmap_backporter_studio.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
